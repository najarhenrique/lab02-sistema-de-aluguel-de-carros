<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Clientes</title></head>
<body>
<h1>Clientes</h1>
<p th:if="${sucesso}" th:text="${sucesso}"></p>
<a th:href="@{/clientes/novo}">Cadastrar cliente</a>
<table>
    <thead><tr><th>Nome</th><th>CPF</th><th>E-mail</th><th>Acoes</th></tr></thead>
    <tbody>
    <tr th:each="cliente : ${clientes}">
        <td th:text="${cliente.nome}"></td>
        <td th:text="${cliente.cpf}"></td>
        <td th:text="${cliente.email}"></td>
        <td>
            <a th:href="@{/clientes/{id}/editar(id=${cliente.id})}">Editar</a>
            <form th:action="@{/clientes/{id}(id=${cliente.id})}" method="post" style="display:inline">
                <input type="hidden" name="_method" value="delete">
                <button type="submit">Excluir</button>
            </form>
        </td>
    </tr>
    <tr th:if="${#lists.isEmpty(clientes)}"><td colspan="4">Nenhum cliente cadastrado.</td></tr>
    </tbody>
</table>
</body>
</html>
